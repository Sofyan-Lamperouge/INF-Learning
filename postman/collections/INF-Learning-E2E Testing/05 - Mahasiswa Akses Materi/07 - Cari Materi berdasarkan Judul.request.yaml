$kind: http-request
url: "{{base_url}}/api/v1/materi?q={{e2e_aks_mtr_judul}}"
method: GET
queryParams:
  q: "{{e2e_aks_mtr_judul}}"
auth:
  type: bearer
  credentials:
    token: "{{e2e_mahasiswa_token}}"
scripts:
  - type: beforeRequest
    code: "const keys = [\r

      \    \"e2e_mahasiswa_token\",\r

      \    \"e2e_mahasiswa_id\",\r

      \    \"e2e_aks_mtr_id\",\r

      \    \"e2e_aks_mtr_judul\",\r

      \    \"e2e_aks_mtr_semester\",\r

      \    \"e2e_aks_mtr_mata_kuliah\"\r

      ];\r

      \r

      const judul = pm.environment.get(\"e2e_aks_mtr_judul\");\r

      const materiId = pm.environment.get(\"e2e_aks_mtr_id\");\r

      \r

      // Pastikan seluruh variabel tersedia\r

      const missing = keys.filter(\r

      \    key => !pm.environment.get(key)\r

      );\r

      \r

      // Periksa konflik variabel\r

      const conflicts = keys.filter(\r

      \    key => pm.variables.get(key) !== pm.environment.get(key)\r

      );\r

      \r

      if (missing.length > 0) {\r

      \    console.error(\"Variabel belum tersedia:\", missing);\r

      \    pm.execution.skipRequest();\r

      }\r

      \r

      else if (conflicts.length > 0) {\r

      \    console.error(\"Konflik variabel:\", conflicts);\r

      \    pm.execution.skipRequest();\r

      }\r

      \r

      else if (!judul.trim()) {\r

      \    console.error(\"Judul materi tidak valid.\");\r

      \    pm.execution.skipRequest();\r

      }\r

      \r

      else if (!/^[1-9]\\d*$/.test(materiId)) {\r

      \    console.error(\"ID materi tidak valid.\");\r

      \    pm.execution.skipRequest();\r

      }\r

      \r

      else {\r

      \    console.log(\"Kata kunci pencarian:\", judul);\r

      \    console.log(\"ID materi pengujian:\", materiId);\r

      }"
    language: text/javascript
  - type: afterResponse
    code: "const response = pm.response.json();\r

      \r

      const judul = pm.environment.get(\"e2e_aks_mtr_judul\");\r

      const keyword = judul.toLowerCase();\r

      \r

      const materiId = Number(\r

      \    pm.environment.get(\"e2e_aks_mtr_id\")\r

      );\r

      \r

      const semester = Number(\r

      \    pm.environment.get(\"e2e_aks_mtr_semester\")\r

      );\r

      \r

      const mataKuliah = pm.environment.get(\r

      \    \"e2e_aks_mtr_mata_kuliah\"\r

      );\r

      \r

      const items = Array.isArray(response.items)\r

      \    ? response.items\r

      \    : [];\r

      \r

      const materi = items.find(\r

      \    item => item.id === materiId\r

      );\r

      \r

      // SRC-01: Status code berhasil\r

      pm.test(\"SRC-01: Status code 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      // SRC-02: Response JSON\r

      pm.test(\"SRC-02: Response berupa JSON\", function () {\r

      \    pm.response.to.be.json;\r

      });\r

      \r

      // SRC-03: Items berupa array\r

      pm.test(\"SRC-03: Items berupa array\", function () {\r

      \    pm.expect(response.items).to.be.an(\"array\");\r

      });\r

      \r

      // SRC-04: Hasil pencarian tidak kosong\r

      pm.test(\"SRC-04: Hasil pencarian tidak kosong\", function () {\r

      \    pm.expect(items.length).to.be.above(0);\r

      });\r

      \r

      // SRC-05: Seluruh hasil sesuai kata kunci\r

      pm.test(\"SRC-05: Seluruh hasil sesuai kata kunci\", function () {\r

      \    pm.expect(items.length).to.be.above(0);\r

      \r

      \    // SQL LIKE mendukung wildcard % dan _\r

      \    const pattern = Array.from(keyword).map(char => {\r

      \        if (char === \"%\") return \"[\\\\s\\\\S]*\";\r

      \        if (char === \"_\") return \"[\\\\s\\\\S]\";\r

      \        return char.replace(/[.*+?^${}()|[\\]\\\\]/g, \"\\\\$&\");\r

      \    }).join(\"\");\r

      \r

      \    const matcher = new RegExp(pattern, \"iu\");\r

      \r

      \    items.forEach(item => {\r

      \        const judulMateri = item.judul || \"\";\r

      \        const deskripsi = item.deskripsi || \"\";\r

      \r

      \        const sesuai =\r

      \            matcher.test(judulMateri) ||\r

      \            matcher.test(deskripsi);\r

      \r

      \        pm.expect(\r

      \            sesuai,\r

      \            `Materi ID ${item.id} tidak sesuai kata kunci`\r

      \        ).to.be.true;\r

      \    });\r

      });\r

      \r

      // SRC-06: Seluruh materi berstatus terbit\r

      pm.test(\"SRC-06: Seluruh materi berstatus terbit\", function () {\r

      \    pm.expect(items.length).to.be.above(0);\r

      \r

      \    items.forEach(item => {\r

      \        pm.expect(item.status).to.eql(\"terbit\");\r

      \    });\r

      });\r

      \r

      // SRC-07: Materi pengujian ditemukan\r

      pm.test(\"SRC-07: Materi pengujian ditemukan\", function () {\r

      \    pm.expect(materi).to.exist;\r

      });\r

      \r

      // SRC-08: ID materi sesuai\r

      pm.test(\"SRC-08: ID materi sesuai\", function () {\r

      \    pm.expect(materi?.id).to.eql(materiId);\r

      });\r

      \r

      // SRC-09: Judul materi sesuai\r

      pm.test(\"SRC-09: Judul materi sesuai\", function () {\r

      \    pm.expect(materi?.judul).to.eql(judul);\r

      });\r

      \r

      // SRC-10: Semester dan mata kuliah sesuai\r

      pm.test(\"SRC-10: Semester dan mata kuliah sesuai\", function () {\r

      \    pm.expect(materi?.semester).to.eql(semester);\r

      \    pm.expect(materi?.mata_kuliah).to.eql(mataKuliah);\r

      });\r

      \r

      // SRC-11: Pagination valid\r

      pm.test(\"SRC-11: Pagination valid\", function () {\r

      \    pm.expect(response.page).to.eql(1);\r

      \    pm.expect(response.limit).to.eql(20);\r

      \r

      \    pm.expect(Number.isInteger(response.total))\r

      \        .to.be.true;\r

      \r

      \    pm.expect(response.total)\r

      \        .to.be.at.least(items.length);\r

      \r

      \    pm.expect(items.length)\r

      \        .to.be.at.most(response.limit);\r

      \r

      \    pm.expect(response.total_pages)\r

      \        .to.eql(Math.ceil(response.total / response.limit));\r

      });\r

      \r

      // SRC-12: Status belajar mahasiswa valid\r

      pm.test(\"SRC-12: Status belajar mahasiswa valid\", function () {\r

      \    const statusValid = [\"belum\", \"dilihat\", \"selesai\"];\r

      \r

      \    items.forEach(item => {\r

      \        pm.expect(statusValid)\r

      \            .to.include(item.status_belajar);\r

      \    });\r

      });"
    language: text/javascript
examples: .resources/07 - Cari Materi berdasarkan Judul.resources/examples
order: 7000
