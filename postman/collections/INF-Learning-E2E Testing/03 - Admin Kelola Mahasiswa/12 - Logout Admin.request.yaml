$kind: http-request
url: "{{base_url}}/api/v1/auth/logout"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{e2e_admin_token}}"
scripts:
  - type: beforeRequest
    code: "const token = pm.environment.get(\"e2e_admin_token\");\r

      \r

      // Pastikan token admin tersedia\r

      if (!token) {\r

      \    console.error(\"Token admin belum tersedia.\");\r

      \    pm.execution.skipRequest();\r

      }\r

      \r

      // Pastikan tidak ada konflik variabel\r

      else if (\r

      \    pm.variables.get(\"e2e_admin_token\") !== token\r

      ) {\r

      \    console.error(\"Terdeteksi konflik variabel token.\");\r

      \    pm.execution.skipRequest();\r

      }"
    language: text/javascript
  - type: afterResponse
    code: "const response = pm.response.json();\r

      \r

      // LOGOUT-01: Status berhasil\r

      pm.test(\"LOGOUT-01: Status code 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      // LOGOUT-02: Response JSON\r

      pm.test(\"LOGOUT-02: Response berupa JSON\", function () {\r

      \    pm.response.to.be.json;\r

      });\r

      \r

      // LOGOUT-03: Logout admin berhasil\r

      pm.test(\"LOGOUT-03: Logout admin berhasil\", function () {\r

      \    pm.expect(response.detail).to.eql(\"Berhasil keluar\");\r

      });\r

      \r

      // Bersihkan token dan ID admin\r

      if (\r

      \    pm.response.code === 200 &&\r

      \    response.detail === \"Berhasil keluar\"\r

      ) {\r

      \    pm.environment.unset(\"e2e_admin_token\");\r

      \    pm.environment.unset(\"e2e_admin_id\");\r

      }\r

      \r

      // LOGOUT-04: Token admin dibersihkan\r

      pm.test(\"LOGOUT-04: Token admin dibersihkan\", function () {\r

      \    pm.expect(\r

      \        pm.environment.get(\"e2e_admin_token\")\r

      \    ).to.be.undefined;\r

      });\r

      \r

      // LOGOUT-05: ID admin dibersihkan\r

      pm.test(\"LOGOUT-05: ID admin dibersihkan\", function () {\r

      \    pm.expect(\r

      \        pm.environment.get(\"e2e_admin_id\")\r

      \    ).to.be.undefined;\r

      });\r

      \r

      // LOGOUT-06: Data pengujian sudah dibersihkan\r

      pm.test(\"LOGOUT-06: Data pengujian sudah dibersihkan\", function () {\r

      \    pm.expect(\r

      \        pm.environment.get(\"e2e_mhs_id\")\r

      \    ).to.be.undefined;\r

      \r

      \    pm.expect(\r

      \        pm.environment.get(\"e2e_mhs_nim\")\r

      \    ).to.be.undefined;\r

      \r

      \    pm.expect(\r

      \        pm.environment.get(\"e2e_mhs_nama\")\r

      \    ).to.be.undefined;\r

      });"
    language: text/javascript
examples: .resources/12 - Logout Admin.resources/examples
order: 12000
