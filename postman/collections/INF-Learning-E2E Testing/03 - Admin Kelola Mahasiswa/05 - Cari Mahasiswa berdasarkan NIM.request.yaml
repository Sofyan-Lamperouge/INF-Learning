$kind: http-request
url: "{{base_url}}/api/v1/mahasiswa?q={{e2e_mhs_nim}}"
method: GET
queryParams:
  q: "{{e2e_mhs_nim}}"
auth:
  type: bearer
  credentials:
    token: "{{e2e_admin_token}}"
scripts:
  - type: beforeRequest
    code: "const token = pm.environment.get(\"e2e_admin_token\");\r

      const id = pm.environment.get(\"e2e_mhs_id\");\r

      const nim = pm.environment.get(\"e2e_mhs_nim\");\r

      const nama = pm.environment.get(\"e2e_mhs_nama\");\r

      \r

      // Pastikan data pengujian tersedia\r

      if (!token || !id || !nim || !nama) {\r

      \    console.error(\"Token atau data mahasiswa belum tersedia.\");\r

      \    pm.execution.skipRequest();\r

      }\r

      \r

      // Pastikan tidak ada konflik variabel\r

      else if (\r

      \    pm.variables.get(\"e2e_admin_token\") !== token ||\r

      \    pm.variables.get(\"e2e_mhs_nim\") !== nim\r

      ) {\r

      \    console.error(\"Terdeteksi konflik variabel.\");\r

      \    pm.execution.skipRequest();\r

      }"
    language: text/javascript
  - type: afterResponse
    code: "const response = pm.response.json();\r

      \r

      const id = Number(pm.environment.get(\"e2e_mhs_id\"));\r

      const nim = pm.environment.get(\"e2e_mhs_nim\");\r

      const nama = pm.environment.get(\"e2e_mhs_nama\");\r

      \r

      // SEARCH-01: Status berhasil\r

      pm.test(\"SEARCH-01: Status code 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      // SEARCH-02: Response JSON\r

      pm.test(\"SEARCH-02: Response berupa JSON\", function () {\r

      \    pm.response.to.be.json;\r

      });\r

      \r

      // SEARCH-03: Hasil pencarian berupa array\r

      pm.test(\"SEARCH-03: Hasil pencarian berupa array\", function () {\r

      \    pm.expect(response.items).to.be.an(\"array\");\r

      });\r

      \r

      // SEARCH-04: Hasil pencarian tidak kosong\r

      pm.test(\"SEARCH-04: Hasil pencarian tidak kosong\", function () {\r

      \    pm.expect(response.items.length).to.be.above(0);\r

      });\r

      \r

      // SEARCH-05: Seluruh hasil sesuai NIM\r

      pm.test(\"SEARCH-05: Seluruh hasil sesuai NIM\", function () {\r

      \    pm.expect(response.items).to.be.an(\"array\").and.not.empty;\r

      \r

      \    response.items.forEach(item => {\r

      \        pm.expect(item.nomor_induk).to.eql(nim);\r

      \    });\r

      });\r

      \r

      // SEARCH-06: Hanya satu mahasiswa ditemukan\r

      pm.test(\"SEARCH-06: Hanya satu mahasiswa ditemukan\", function () {\r

      \    pm.expect(response.items.length).to.eql(1);\r

      });\r

      \r

      const mahasiswa = Array.isArray(response.items)\r

      \    ? response.items.find(item => item.id === id)\r

      \    : undefined;\r

      \r

      // SEARCH-07: Mahasiswa pengujian ditemukan\r

      pm.test(\"SEARCH-07: Mahasiswa pengujian ditemukan\", function () {\r

      \    pm.expect(mahasiswa).to.be.an(\"object\");\r

      });\r

      \r

      // SEARCH-08: ID mahasiswa sesuai\r

      pm.test(\"SEARCH-08: ID mahasiswa sesuai\", function () {\r

      \    pm.expect(mahasiswa.id).to.eql(id);\r

      });\r

      \r

      // SEARCH-09: Nama mahasiswa sesuai\r

      pm.test(\"SEARCH-09: Nama mahasiswa sesuai\", function () {\r

      \    pm.expect(mahasiswa.nama).to.eql(nama);\r

      });\r

      \r

      // SEARCH-10: Status mahasiswa sesuai\r

      pm.test(\"SEARCH-10: Status mahasiswa sesuai\", function () {\r

      \    pm.expect(mahasiswa.status).to.eql(\"belum_aktif\");\r

      });"
    language: text/javascript
examples: .resources/05 - Cari Mahasiswa berdasarkan NIM.resources/examples
order: 5000
