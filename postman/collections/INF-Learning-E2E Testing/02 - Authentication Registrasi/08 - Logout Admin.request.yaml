$kind: http-request
url: "{{base_url}}/api/v1/auth/logout"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{e2e_admin_token}}"
scripts:
  - type: beforeRequest
    code: "const token = pm.environment.get(\"e2e_admin_token\");\r

      \r

      // Pastikan token admin tersedia\r

      if (!token) {\r

      \    throw new Error(\"Token admin belum tersedia.\");\r

      }\r

      \r

      // Pastikan tidak ada konflik variabel token\r

      if (pm.variables.get(\"e2e_admin_token\") !== token) {\r

      \    throw new Error(\"Terdeteksi konflik variabel token admin.\");\r

      }"
    language: text/javascript
  - type: afterResponse
    code: "const response = pm.response.json();\r

      \r

      // LOGOUT-01: Status berhasil\r

      pm.test(\"LOGOUT-01: Status code 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      // LOGOUT-02: Response berupa JSON\r

      pm.test(\"LOGOUT-02: Response berupa JSON\", function () {\r

      \    pm.response.to.be.json;\r

      });\r

      \r

      // LOGOUT-03: Logout admin berhasil\r

      pm.test(\"LOGOUT-03: Logout admin berhasil\", function () {\r

      \    pm.expect(response.detail).to.eql(\"Berhasil keluar\");\r

      });\r

      \r

      // Bersihkan token setelah logout berhasil\r

      if (\r

      \    pm.response.code === 200 &&\r

      \    response.detail === \"Berhasil keluar\"\r

      ) {\r

      \    pm.environment.unset(\"e2e_admin_token\");\r

      \    pm.environment.unset(\"e2e_registrasi_token\");\r

      }\r

      \r

      // LOGOUT-04: Token admin dibersihkan\r

      pm.test(\"LOGOUT-04: Token admin dibersihkan\", function () {\r

      \    pm.expect(\r

      \        pm.environment.get(\"e2e_admin_token\")\r

      \    ).to.be.undefined;\r

      });\r

      \r

      // LOGOUT-05: Token registrasi dibersihkan\r

      pm.test(\"LOGOUT-05: Token registrasi dibersihkan\", function () {\r

      \    pm.expect(\r

      \        pm.environment.get(\"e2e_registrasi_token\")\r

      \    ).to.be.undefined;\r

      });"
    language: text/javascript
examples: .resources/08 - Logout Admin.resources/examples
order: 8000
