$kind: http-request
url: "{{base_url}}/api/v1/auth/logout"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{e2e_registrasi_token}}"
scripts:
  - type: beforeRequest
    code: "const token = pm.environment.get(\"e2e_registrasi_token\");\r

      \r

      // Pastikan token registrasi tersedia\r

      if (!token) {\r

      \    throw new Error(\r

      \        \"Token registrasi belum tersedia. Jalankan REG-04.\"\r

      \    );\r

      }\r

      \r

      // Pastikan tidak ada konflik variabel token\r

      if (pm.variables.get(\"e2e_registrasi_token\") !== token) {\r

      \    throw new Error(\r

      \        \"Terdeteksi konflik variabel token registrasi.\"\r

      \    );\r

      }"
    language: text/javascript
  - type: afterResponse
    code: "const response = pm.response.json();\r

      \r

      // LOGOUT-01: Status berhasil\r

      pm.test(\"LOGOUT-01: Status code 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      // LOGOUT-02: Response berupa JSON\r

      pm.test(\"LOGOUT-02: Response berupa JSON\", function () {\r

      \    pm.response.to.be.json;\r

      });\r

      \r

      // LOGOUT-03: Pesan logout berhasil\r

      pm.test(\"LOGOUT-03: Logout mahasiswa berhasil\", function () {\r

      \    pm.expect(response.detail).to.eql(\"Berhasil keluar\");\r

      });\r

      \r

      // LOGOUT-04: Token mahasiswa tetap tersimpan\r

      pm.test(\"LOGOUT-04: Token registrasi tetap tersimpan\", function () {\r

      \    pm.expect(\r

      \        pm.environment.get(\"e2e_registrasi_token\")\r

      \    ).to.be.a(\"string\").and.not.empty;\r

      });\r

      \r

      // LOGOUT-05: Token admin tetap tersimpan\r

      pm.test(\"LOGOUT-05: Token admin tetap tersimpan\", function () {\r

      \    pm.expect(\r

      \        pm.environment.get(\"e2e_admin_token\")\r

      \    ).to.be.a(\"string\").and.not.empty;\r

      });"
    language: text/javascript
examples: .resources/06 - Logout Mahasiswa.resources/examples
order: 6000
