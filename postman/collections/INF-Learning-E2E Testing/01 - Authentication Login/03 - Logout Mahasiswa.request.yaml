$kind: http-request
url: "{{base_url}}/api/v1/auth/logout"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{e2e_mahasiswa_token}}"
scripts:
  - type: afterResponse
    code: "const response = pm.response.json();\r

      \r

      // LOGOUT-01: Status berhasil\r

      pm.test(\"LOGOUT-01: Status code 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      // LOGOUT-02: Response berupa JSON\r

      pm.test(\"LOGOUT-02: Response berupa JSON\", function () {\r

      \    pm.response.to.be.json;\r

      });\r

      \r

      // LOGOUT-03: Pesan logout berhasil\r

      pm.test(\"LOGOUT-03: Logout berhasil\", function () {\r

      \    pm.expect(response.detail).to.eql(\"Berhasil keluar\");\r

      });"
    language: text/javascript
examples: .resources/03 - Logout Mahasiswa.resources/examples
order: 3000
