$kind: http-request
url: "{{base_url}}/api/v1/materi"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{e2e_admin_token}}"
scripts:
  - type: beforeRequest
    code: "const token = pm.environment.get(\"e2e_admin_token\");\r

      const id = pm.environment.get(\"e2e_mtr_id\");\r

      const judul = pm.environment.get(\"e2e_mtr_judul\");\r

      \r

      // Pastikan data pengujian tersedia\r

      if (!token || !id || !judul) {\r

      \    console.error(\"Token atau data materi belum tersedia.\");\r

      \    pm.execution.skipRequest();\r

      }\r

      \r

      // Pastikan tidak ada konflik variabel\r

      else if (\r

      \    pm.variables.get(\"e2e_admin_token\") !== token ||\r

      \    pm.variables.get(\"e2e_mtr_id\") !== id ||\r

      \    pm.variables.get(\"e2e_mtr_judul\") !== judul\r

      ) {\r

      \    console.error(\"Terdeteksi konflik variabel.\");\r

      \    pm.execution.skipRequest();\r

      }\r

      \r

      // Validasi identitas materi pengujian\r

      else if (\r

      \    !/^[1-9]\\d*$/.test(id) ||\r

      \    !/^E2E Kelola Materi \\d+$/.test(judul)\r

      ) {\r

      \    console.error(\"Identitas materi tidak valid.\");\r

      \    pm.execution.skipRequest();\r

      }"
    language: text/javascript
  - type: afterResponse
    code: "const response = pm.response.json();\r

      \r

      const id = Number(pm.environment.get(\"e2e_mtr_id\"));\r

      const judul = pm.environment.get(\"e2e_mtr_judul\");\r

      const adminId = Number(pm.environment.get(\"e2e_admin_id\"));\r

      \r

      const items = Array.isArray(response.items)\r

      \    ? response.items\r

      \    : [];\r

      \r

      // Cari materi berdasarkan ID dinamis\r

      const materi = items.find(item => item.id === id);\r

      \r

      // LIST-01: Status code berhasil\r

      pm.test(\"LIST-01: Status code 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      // LIST-02: Response JSON\r

      pm.test(\"LIST-02: Response berupa JSON\", function () {\r

      \    pm.response.to.be.json;\r

      });\r

      \r

      // LIST-03: Items berupa array\r

      pm.test(\"LIST-03: Items berupa array\", function () {\r

      \    pm.expect(response.items).to.be.an(\"array\");\r

      });\r

      \r

      // LIST-04: Daftar materi tidak kosong\r

      pm.test(\"LIST-04: Daftar materi tidak kosong\", function () {\r

      \    pm.expect(items.length).to.be.above(0);\r

      });\r

      \r

      // LIST-05: Materi pengujian ditemukan\r

      pm.test(\"LIST-05: Materi pengujian ditemukan\", function () {\r

      \    pm.expect(materi).to.exist;\r

      });\r

      \r

      // LIST-06: ID materi sesuai\r

      pm.test(\"LIST-06: ID materi sesuai\", function () {\r

      \    pm.expect(materi?.id).to.eql(id);\r

      });\r

      \r

      // LIST-07: Judul materi sesuai\r

      pm.test(\"LIST-07: Judul materi sesuai\", function () {\r

      \    pm.expect(materi?.judul).to.eql(judul);\r

      });\r

      \r

      // LIST-08: Mata kuliah sesuai\r

      pm.test(\"LIST-08: Mata kuliah sesuai\", function () {\r

      \    pm.expect(materi?.mata_kuliah)\r

      \        .to.eql(\"Sistem Terdistribusi\");\r

      });\r

      \r

      // LIST-09: Semester sesuai\r

      pm.test(\"LIST-09: Semester sesuai\", function () {\r

      \    pm.expect(materi?.semester).to.eql(4);\r

      });\r

      \r

      // LIST-10: Jenis materi PDF\r

      pm.test(\"LIST-10: Jenis materi PDF\", function () {\r

      \    pm.expect(materi?.jenis).to.eql(\"pdf\");\r

      });\r

      \r

      // LIST-11: Status materi terbit\r

      pm.test(\"LIST-11: Status materi terbit\", function () {\r

      \    pm.expect(materi?.status).to.eql(\"terbit\");\r

      });\r

      \r

      // LIST-12: Materi dibuat oleh admin\r

      pm.test(\"LIST-12: Materi dibuat oleh admin\", function () {\r

      \    pm.expect(materi?.dibuat_oleh).to.eql(adminId);\r

      });\r

      \r

      // LIST-13: Status belajar admin null\r

      pm.test(\"LIST-13: Status belajar admin null\", function () {\r

      \    pm.expect(materi?.status_belajar).to.be.null;\r

      });"
    language: text/javascript
examples: .resources/03 - Lihat Daftar Materi.resources/examples
order: 3000
