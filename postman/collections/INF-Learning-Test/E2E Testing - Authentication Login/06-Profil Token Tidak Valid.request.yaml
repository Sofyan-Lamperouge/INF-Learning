$kind: http-request
url: "{{base_url}}/auth/me"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{token_expired}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"AUTH-06-01: Token tidak valid ditolak\", function () {\r

      \    pm.expect([401, 403]).to.include(pm.response.code);\r

      });\r

      \r

      pm.test(\"AUTH-06-02: Profil tidak dapat diakses\", function () {\r

      \    pm.expect(pm.response.code).to.not.eql(200);\r

      });"
    language: text/javascript
examples: .resources/06-Profil Token Tidak Valid.resources/examples
order: 6000
