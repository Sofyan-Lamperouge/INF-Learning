$kind: http-request
url: "{{base_url}}/auth/me"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"AUTH-05-01: Request tanpa token ditolak\", function () {\r

      \    pm.expect([401, 403]).to.include(pm.response.code);\r

      });\r

      \r

      pm.test(\"AUTH-05-02: Profil tidak dapat diakses\", function () {\r

      \    pm.expect(pm.response.code).to.not.eql(200);\r

      });"
    language: text/javascript
examples: .resources/05-Profil Tanpa Token.resources/examples
order: 5000
