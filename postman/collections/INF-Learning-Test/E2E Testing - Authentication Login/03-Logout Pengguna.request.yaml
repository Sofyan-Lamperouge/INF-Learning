$kind: http-request
url: "{{base_url}}/auth/logout"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"LOGOUT-01: Status code 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"LOGOUT-02: Response logout tersedia\", function () {\r

      \    pm.expect(pm.response.text()).to.not.be.empty;\r

      });"
    language: text/javascript
examples: .resources/03-Logout Pengguna.resources/examples
order: 3000
