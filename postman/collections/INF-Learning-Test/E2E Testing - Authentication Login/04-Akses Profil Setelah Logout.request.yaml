$kind: http-request
url: "{{base_url}}/auth/me"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"AUTH-04-01: Token setelah logout ditolak\", function () {\r

      \    pm.expect([401, 403]).to.include(pm.response.code);\r

      });\r

      \r

      pm.test(\"AUTH-04-02: Profil tidak dapat diakses\", function () {\r

      \    pm.expect(pm.response.code).to.not.eql(200);\r

      });"
    language: text/javascript
examples: .resources/04-Akses Profil Setelah Logout.resources/examples
order: 4000
