$kind: http-request
url: "{{base_url}}/materi/kategori/mata-kuliah?semester=5"
method: GET
queryParams:
  semester: "5"
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: "const json = pm.response.json();\r

      \r

      pm.test(\"Status code harus 200 OK\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Semester sesuai request\", function () {\r

      \    pm.expect(json.semester).to.eql(5);\r

      });\r

      \r

      pm.test(\"Items berbentuk array\", function () {\r

      \    pm.expect(json.items).to.be.an(\"array\");\r

      });\r

      \r

      pm.test(\"Setiap mata kuliah memiliki struktur benar\", function () {\r

      \    json.items.forEach(function (item) {\r

      \        pm.expect(item.mata_kuliah).to.be.a(\"string\");\r

      \        pm.expect(item.mata_kuliah.length).to.be.above(0);\r

      \        pm.expect(item.total_materi).to.be.a(\"number\");\r

      \    });\r

      });\r

      \r

      pm.test(\"Jumlah materi tidak negatif\", function () {\r

      \    json.items.forEach(function (item) {\r

      \        pm.expect(item.total_materi).to.be.at.least(0);\r

      \    });\r

      });\r

      \r

      pm.test(\"Tidak ada nama mata kuliah duplikat\", function () {\r

      \    const namaMK = json.items.map(item => item.mata_kuliah);\r

      \r

      \    pm.expect(new Set(namaMK).size).to.eql(namaMK.length);\r

      });\r

      \r

      pm.test(\"Mata kuliah terurut alfabetis\", function () {\r

      \    const namaMK = json.items.map(item => item.mata_kuliah);\r

      \    const sorted = [...namaMK].sort((a, b) =>\r

      \        a.localeCompare(b, \"id\")\r

      \    );\r

      \r

      \    pm.expect(namaMK).to.eql(sorted);\r

      });"
    language: text/javascript
examples: .resources/READ-06-Melihat Kategori Mata Kuliah.resources/examples
order: 7000
