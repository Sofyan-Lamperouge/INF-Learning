$kind: http-request
name: MTR-07-Pagination Daftar Materi
url: "{{base_url}}/materi?page=1&limit=1"
method: GET
queryParams:
  page: "1"
  limit: "1"
auth:
  type: bearer
  credentials:
    token: "{{admin_access_token}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Struktur pagination tersedia\", function () {\r

      \    const response = pm.response.json();\r

      \r

      \    pm.expect(response).to.have.property(\"items\");\r

      \    pm.expect(response).to.have.property(\"total\");\r

      \    pm.expect(response).to.have.property(\"page\");\r

      \    pm.expect(response).to.have.property(\"limit\");\r

      \    pm.expect(response).to.have.property(\"total_pages\");\r

      });\r

      \r

      pm.test(\"Nomor halaman sesuai request\", function () {\r

      \    const response = pm.response.json();\r

      \r

      \    pm.expect(response.page).to.eql(1);\r

      });\r

      \r

      pm.test(\"Limit sesuai request\", function () {\r

      \    const response = pm.response.json();\r

      \r

      \    pm.expect(response.limit).to.eql(1);\r

      });\r

      \r

      pm.test(\"Jumlah data tidak melebihi limit\", function () {\r

      \    const response = pm.response.json();\r

      \r

      \    pm.expect(response.items).to.be.an(\"array\");\r

      \    pm.expect(response.items.length).to.be.at.most(1);\r

      });\r

      \r

      pm.test(\"Perhitungan total halaman sesuai\", function () {\r

      \    const response = pm.response.json();\r

      \r

      \    const expectedPages = Math.ceil(response.total / response.limit);\r

      \r

      \    pm.expect(response.total_pages).to.eql(expectedPages);\r

      });"
    language: text/javascript
examples: .resources/MTR-07-Pagination Daftar Materi-1.resources/examples
order: 7000
