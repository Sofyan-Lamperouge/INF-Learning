$kind: http-request
name: MTR-02-Admin Melihat Kategori Semester
url: "{{base_url}}/materi/kategori/semester"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{admin_access_token}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Data kategori semester tersedia\", function () {\r

      \    const response = pm.response.json();\r

      \r

      \    pm.expect(response).to.have.property(\"items\");\r

      \    pm.expect(response.items).to.be.an(\"array\");\r

      });\r

      \r

      pm.test(\"Struktur kategori semester sesuai\", function () {\r

      \    const response = pm.response.json();\r

      \r

      \    response.items.forEach(function (item) {\r

      \        pm.expect(item).to.have.property(\"semester\");\r

      \        pm.expect(item).to.have.property(\"total_materi\");\r

      \        pm.expect(item).to.have.property(\"total_mata_kuliah\");\r

      \    });\r

      });\r

      \r

      pm.test(\"Nomor semester berada pada rentang 1-8\", function () {\r

      \    const response = pm.response.json();\r

      \r

      \    response.items.forEach(function (item) {\r

      \        pm.expect(item.semester).to.be.within(1, 8);\r

      \    });\r

      });\r

      \r

      pm.test(\"Jumlah materi dan mata kuliah valid\", function () {\r

      \    const response = pm.response.json();\r

      \r

      \    response.items.forEach(function (item) {\r

      \        pm.expect(item.total_materi).to.be.at.least(0);\r

      \        pm.expect(item.total_mata_kuliah).to.be.at.least(0);\r

      \    });\r

      });\r\n"
    language: text/javascript
examples: .resources/MTR-02-Admin Melihat Kategori Semester-1.resources/examples
order: 2000
