$kind: http-request
url: "{{base_url}}/auth/login"
method: POST
body:
  type: json
  content: "{\r

    \    \"nomor_induk\": \"{{nim_register}}\",\r

    \    \"kata_sandi\": \"\"\r

    }"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code adalah 422\", function () {\r

      \    pm.response.to.have.status(422);\r

      });\r

      \r

      pm.test(\"Login dengan password kosong ditolak\", function () {\r

      \    const response = pm.response.json();\r

      \    pm.expect(response).to.have.property(\"detail\");\r

      });\r

      \r

      pm.test(\"Access token tidak diberikan\", function () {\r

      \    const response = pm.response.json();\r

      \    pm.expect(response).to.not.have.property(\"access_token\");\r

      });\r

      \r

      pm.test(\"Detail validasi tersedia\", function () {\r

      \    const response = pm.response.json();\r

      \    pm.expect(response.detail).to.be.an(\"array\");\r

      });"
    language: text/javascript
examples: .resources/LOG-05-Login dengan Password Kosong.resources/examples
order: 5000
