$kind: http-request
url: "{{base_url}}/auth/login"
method: POST
body:
  type: json
  content: "{\r

    \    \"nomor_induk\": \"2488010098\",\r

    \    \"kata_sandi\": \"{{password_register}}\"\r

    }"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 401\", function () {\r

      \    pm.response.to.have.status(401);\r

      });\r

      \r

      pm.test(\"Login ditolak\", function () {\r

      \    const response = pm.response.json();\r

      \    pm.expect(response).to.have.property(\"detail\");\r

      });\r

      \r

      pm.test(\"Access token tidak diberikan\", function () {\r

      \    const response = pm.response.json();\r

      \    pm.expect(response).to.not.have.property(\"access_token\");\r

      });"
    language: text/javascript
examples: .resources/LOG-03-Login dengan NIM Salah.resources/examples
order: 3000
