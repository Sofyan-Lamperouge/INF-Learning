$kind: http-request
url: "{{base_url}}/mahasiswa/{{mahasiswa_id}}"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{admin_access_token}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code 204\", function () {\r

      \    pm.response.to.have.status(204);\r

      });\r

      \r

      pm.test(\"Response body kosong\", function () {\r

      \    pm.expect(pm.response.text()).to.eql(\"\");\r

      });"
    language: text/javascript
examples: .resources/MHS-05-Menghapus Mahasiswa.resources/examples
order: 5000
