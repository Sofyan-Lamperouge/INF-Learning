$kind: http-request
url: "{{base_url}}/profil/foto"
method: PUT
body:
  type: formdata
  content:
    - type: file
      key: file
      src:
        - /D:/SEMESTER 5/Cloud Computing/Materi 2-3 - Mekanisme CLoud Computing.pdf
      description: ""
      disabled: false
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code 400 Bad Request\", function () {\r

      \    pm.response.to.have.status(400);\r

      });\r

      \r

      pm.test(\"Response berupa JSON\", function () {\r

      \    pm.response.to.be.json;\r

      });\r

      \r

      pm.test(\"Backend menolak format file yang salah\", function () {\r

      \    const response = pm.response.json();\r

      \r

      \    pm.expect(response).to.have.property(\"detail\");\r

      \    pm.expect(response.detail).to.include(\r

      \        \"Format foto tidak diizinkan\"\r

      \    );\r

      });\r

      \r

      pm.test(\"Foto profil tidak berubah\", function () {\r

      \    const response = pm.response.json();\r

      \r

      \    pm.expect(response).to.have.property(\"detail\");\r

      });"
    language: text/javascript
examples: .resources/PROF-03-Mengunggah Foto dengan Format Tidak Diizinkan.resources/examples
order: 3000
