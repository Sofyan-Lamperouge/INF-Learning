$kind: http-request
url: "{{base_url}}/profil/foto"
method: DELETE
auth:
  type: bearer
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code 401 Unauthorized\", function () {\r

      \    pm.response.to.have.status(401);\r

      });\r

      \r

      pm.test(\"Response berupa JSON\", function () {\r

      \    pm.response.to.be.json;\r

      });\r

      \r

      pm.test(\"Backend menolak penghapusan tanpa token\", function () {\r

      \    const response = pm.response.json();\r

      \r

      \    pm.expect(response).to.have.property(\"detail\");\r

      \    pm.expect(response.detail).to.be.a(\"string\");\r

      \    pm.expect(response.detail.length).to.be.greaterThan(0);\r

      });"
    language: text/javascript
examples: .resources/PROF-08-Menghapus Foto Profil Tanpa Token.resources/examples
order: 8000
