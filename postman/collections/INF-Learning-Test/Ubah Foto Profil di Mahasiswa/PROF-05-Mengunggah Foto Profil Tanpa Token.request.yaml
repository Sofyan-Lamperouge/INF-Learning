$kind: http-request
url: "{{base_url}}/profil/foto"
method: PUT
body:
  type: formdata
  content:
    - type: file
      key: file
      src:
        - /C:/Users/MyBook Hype AMD/OneDrive/Documents/Pictures/Saved Pictures/Image 2026-03-29 at 12.26.55 AM.jpeg
      description: ""
      disabled: false
auth:
  type: bearer
  credentials:
    token: ""
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code 401 Unauthorized\", function () {\r

      \    pm.response.to.have.status(401);\r

      });\r

      \r

      pm.test(\"Response berupa JSON\", function () {\r

      \    pm.response.to.be.json;\r

      });\r

      \r

      pm.test(\"Backend menolak akses tanpa token\", function () {\r

      \    const response = pm.response.json();\r

      \r

      \    pm.expect(response).to.have.property(\"detail\");\r

      \    pm.expect(response.detail).to.be.a(\"string\");\r

      \    pm.expect(response.detail.length).to.be.greaterThan(0);\r

      });\r

      \r

      pm.test(\"Foto profil tidak dikirim atau diperbarui\", function () {\r

      \    pm.expect(\r

      \        pm.response.headers.get(\"Content-Disposition\")\r

      \    ).to.be.oneOf([null, undefined]);\r

      });"
    language: text/javascript
examples: .resources/PROF-05-Mengunggah Foto Profil Tanpa Token.resources/examples
order: 5000
