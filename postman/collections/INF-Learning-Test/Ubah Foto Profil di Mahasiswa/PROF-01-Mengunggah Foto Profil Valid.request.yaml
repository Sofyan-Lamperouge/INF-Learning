$kind: http-request
url: "{{base_url}}/profil/foto"
method: PUT
body:
  type: formdata
  content:
    - type: file
      key: file
      src:
        - /C:/Users/MyBook Hype AMD/OneDrive/Documents/Pictures/Saved Pictures/Image 2026-03-29 at 12.26.55 AM.jpeg
      description: ""
      disabled: false
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code 200 OK\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Response berupa JSON\", function () {\r

      \    pm.response.to.be.json;\r

      });\r

      \r

      const response = pm.response.json();\r

      \r

      pm.test(\"Response memiliki field foto_url\", function () {\r

      \    pm.expect(response).to.have.property(\"foto_url\");\r

      });\r

      \r

      pm.test(\"URL foto profil tidak kosong\", function () {\r

      \    pm.expect(response.foto_url).to.be.a(\"string\");\r

      \    pm.expect(response.foto_url.length).to.be.greaterThan(0);\r

      });\r

      \r

      pm.test(\"URL foto berasal dari folder uploads\", function () {\r

      \    pm.expect(response.foto_url).to.include(\"/uploads/foto-\");\r

      });\r

      \r

      pm.test(\"Ekstensi foto sesuai format yang diizinkan\", function () {\r

      \    pm.expect(response.foto_url).to.match(/\\.(jpg|png|webp)$/i);\r

      });\r

      \r

      // Simpan URL untuk pengujian berikutnya\r

      if (response.foto_url) {\r

      \    pm.collectionVariables.set(\"foto_url\", response.foto_url);\r

      }"
    language: text/javascript
examples: .resources/PROF-01-Mengunggah Foto Profil Valid.resources/examples
order: 1000
