$kind: http-request
url: "{{base_url}}/auth/registrasi"
method: POST
body:
  type: json
  content: "{\r

    \  \"nomor_induk\": \"{{nim_register}}\",\r

    \  \"kata_sandi\": \"Kuru12345678901234567890123456789012345678901234567890123456789012345678901234567890\",\r

    \  \"konfirmasi_kata_sandi\": \"Kuru12345678901234567890123456789012345678901234567890123456789012345678901234567890\"\r

    }"
scripts:
  - type: afterResponse
    code: "\r

      pm.test(\"Status code 422\", function () {\r

      \    pm.response.to.have.status(422);\r

      });\r

      \r

      pm.test(\"Password terlalu panjang ditolak\", function () {\r

      \    pm.response.to.have.status(422);\r

      \r

      \    const response = pm.response.json();\r

      \r

      \    pm.expect(JSON.stringify(response))\r

      \        .to.include(\"string_too_long\");\r

      });\r\n"
    language: text/javascript
examples: .resources/REG-07 - Password Melebihi Batas.resources/examples
order: 7000
