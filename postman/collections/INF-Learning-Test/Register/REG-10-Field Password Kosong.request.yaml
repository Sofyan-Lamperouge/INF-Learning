$kind: http-request
url: "{{base_url}}/auth/registrasi"
method: POST
body:
  type: json
  content: "{\r

    \  \"nomor_induk\": \"{{nim_register}}\",\r

    \  \"kata_sandi\": \"\",\r

    \  \"konfirmasi_kata_sandi\": \"{{password_register}}\"\r

    }"
scripts:
  - type: afterResponse
    code: "pm.test(\"Password kosong ditolak\", function () {\r

      \    pm.response.to.have.status(422);\r

      \r

      \    const response = pm.response.json();\r

      \    pm.expect(JSON.stringify(response))\r

      \        .to.include(\"kata_sandi\");\r

      });"
    language: text/javascript
examples: .resources/REG-10-Field Password Kosong.resources/examples
order: 10000
