$kind: http-request
url: "{{base_url}}/auth/registrasi"
method: POST
body:
  type: json
  content: "{\r

    \  \"nomor_induk\": \"{{nim_register}}\",\r

    \  \"kata_sandi\": \"{{password_register\",\r

    \  \"konfirmasi_kata_sandi\": \"Kurumi98!\"\r

    }"
scripts:
  - type: afterResponse
    code: "\r

      pm.test(\"Status code 422\", function () {\r

      \    pm.response.to.have.status(422);\r

      });\r

      \r

      pm.test(\"Konfirmasi password tidak cocok ditolak\", function () {\r

      \    const response = pm.response.json();\r

      \r

      \    pm.expect(response.detail).to.be.an(\"array\");\r

      \r

      \    const errorText = JSON.stringify(response.detail);\r

      \r

      \    pm.expect(errorText)\r

      \        .to.include(\"Konfirmasi kata sandi tidak cocok\");\r

      });\r\n"
    language: text/javascript
examples: .resources/REG-06 - Konfirmasi Password Tidak Cocok.resources/examples
order: 6000
