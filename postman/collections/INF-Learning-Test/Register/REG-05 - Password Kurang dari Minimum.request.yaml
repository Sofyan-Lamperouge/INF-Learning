      pm.test(\"Password kurang dari 8 karakter ditolak\", function () {\r

      \    const response = pm.response.json();\r

      \r

      \    pm.expect(response.detail).to.be.an(\"array\");\r

      });\r\n"
    language: text/javascript
examples: .resources/REG-05 - Password Kurang dari Minimum.resources/examples
