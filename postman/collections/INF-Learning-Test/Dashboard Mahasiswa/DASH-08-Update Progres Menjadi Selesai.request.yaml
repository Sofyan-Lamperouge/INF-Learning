$kind: http-request
url: "{{base_url}}/materi/17/progres"
method: POST
body:
  type: json
  content: "{\r\n  \"status\": \"selesai\"\r\n}"
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: "const json = pm.response.json();\r

      \r

      pm.test(\"Status code harus 200 OK\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Response memiliki struktur yang benar\", function () {\r

      \    pm.expect(json).to.have.property(\"materi_id\");\r

      \    pm.expect(json).to.have.property(\"status\");\r

      \    pm.expect(json).to.have.property(\"diubah_pada\");\r

      });\r

      \r

      pm.test(\"ID materi sesuai dengan request\", function () {\r

      \    pm.expect(json.materi_id).to.eql(17);\r

      });\r

      \r

      pm.test(\"Status progres berhasil menjadi selesai\", function () {\r

      \    pm.expect(json.status).to.eql(\"selesai\");\r

      });\r

      \r

      pm.test(\"Waktu perubahan memiliki format tanggal valid\", function () {\r

      \    pm.expect(Date.parse(json.diubah_pada)).to.not.be.NaN;\r

      });"
    language: text/javascript
examples: .resources/DASH-08-Update Progres Menjadi Selesai.resources/examples
order: 8000
