$kind: http-request
url: "{{base_url}}/mahasiswa/dashboard"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: "const json = pm.response.json();\r

      \r

      // =====================================\r

      // 1. VALIDASI MATERI TERBARU\r

      // =====================================\r

      \r

      pm.test(\"Materi terbaru berbentuk array\", function () {\r

      \    pm.expect(json.materi_terbaru).to.be.an(\"array\");\r

      });\r

      \r

      pm.test(\"Materi terbaru maksimal 5 item\", function () {\r

      \    pm.expect(json.materi_terbaru.length).to.be.at.most(5);\r

      });\r

      \r

      pm.test(\"Setiap materi terbaru memiliki struktur yang benar\", function () {\r

      \    json.materi_terbaru.forEach(function (materi) {\r

      \        pm.expect(materi.id).to.be.a(\"number\");\r

      \        pm.expect(materi.judul).to.be.a(\"string\");\r

      \        pm.expect(materi.mata_kuliah).to.be.a(\"string\");\r

      \        pm.expect(materi.semester).to.be.a(\"number\");\r

      \        pm.expect(materi.jenis).to.be.a(\"string\");\r

      \        pm.expect(materi.url).to.be.a(\"string\");\r

      \        pm.expect(materi.dibuat_pada).to.be.a(\"string\");\r

      \r

      \        pm.expect([\r

      \            \"belum\",\r

      \            \"dilihat\",\r

      \            \"selesai\"\r

      \        ]).to.include(materi.status_belajar);\r

      \    });\r

      });\r

      \r

      pm.test(\"Materi terbaru hanya berisi materi terbit\", function () {\r

      \    json.materi_terbaru.forEach(function (materi) {\r

      \        pm.expect(materi.id).to.be.a(\"number\");\r

      \    });\r

      });\r

      \r

      // =====================================\r

      // 2. VALIDASI PROGRES MATA KULIAH\r

      // =====================================\r

      \r

      pm.test(\"Progres mata kuliah berbentuk array\", function () {\r

      \    pm.expect(json.progres_mata_kuliah).to.be.an(\"array\");\r

      });\r

      \r

      pm.test(\"Setiap progres mata kuliah memiliki struktur benar\", function () {\r

      \    json.progres_mata_kuliah.forEach(function (progres) {\r

      \        pm.expect(progres.mata_kuliah).to.be.a(\"string\");\r

      \        pm.expect(progres.total).to.be.a(\"number\");\r

      \        pm.expect(progres.selesai).to.be.a(\"number\");\r

      \        pm.expect(progres.persen).to.be.a(\"number\");\r

      \    });\r

      });\r

      \r

      pm.test(\"Jumlah materi dan progres tidak negatif\", function () {\r

      \    json.progres_mata_kuliah.forEach(function (progres) {\r

      \        pm.expect(progres.total).to.be.at.least(0);\r

      \        pm.expect(progres.selesai).to.be.at.least(0);\r

      \r

      \        pm.expect(progres.selesai).to.be.at.most(progres.total);\r

      \    });\r

      });\r

      \r

      pm.test(\"Persentase progres sesuai perhitungan\", function () {\r

      \    json.progres_mata_kuliah.forEach(function (progres) {\r

      \        const expected = progres.total === 0\r

      \            ? 0\r

      \            : Number((\r

      \                progres.selesai / progres.total * 100\r

      \            ).toFixed(1));\r

      \r

      \        pm.expect(progres.persen).to.eql(expected);\r

      \    });\r

      });\r

      \r

      pm.test(\"Persentase progres berada pada rentang 0-100\", function () {\r

      \    json.progres_mata_kuliah.forEach(function (progres) {\r

      \        pm.expect(progres.persen).to.be.within(0, 100);\r

      \    });\r

      });"
    language: text/javascript
examples: .resources/DASH-06-Validasi Materi dan Progres.resources/examples
order: 6000
