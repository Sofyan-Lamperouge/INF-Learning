$kind: http-request
url: "{{base_url}}/materi?page=1&limit=20"
method: GET
queryParams:
  page: "1"
  limit: "20"
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      const response = pm.response.json();\r

      \r

      pm.test(\"Data materi tersedia\", function () {\r

      \    pm.expect(response).to.have.property(\"items\");\r

      \    pm.expect(response.items).to.be.an(\"array\");\r

      });\r

      \r

      pm.test(\"Struktur pagination tersedia\", function () {\r

      \    pm.expect(response.total).to.be.a(\"number\");\r

      \    pm.expect(response.page).to.be.a(\"number\");\r

      \    pm.expect(response.limit).to.be.a(\"number\");\r

      \    pm.expect(response.total_pages).to.be.a(\"number\");\r

      });\r

      \r

      pm.test(\"Pagination sesuai request\", function () {\r

      \    pm.expect(response.page).to.eql(1);\r

      \    pm.expect(response.limit).to.eql(20);\r

      });\r

      \r

      pm.test(\"Struktur setiap materi sesuai\", function () {\r

      \    response.items.forEach(function (materi) {\r

      \        pm.expect(materi).to.have.property(\"id\");\r

      \        pm.expect(materi).to.have.property(\"judul\");\r

      \        pm.expect(materi).to.have.property(\"deskripsi\");\r

      \        pm.expect(materi).to.have.property(\"mata_kuliah\");\r

      \        pm.expect(materi).to.have.property(\"semester\");\r

      \        pm.expect(materi).to.have.property(\"jenis\");\r

      \        pm.expect(materi).to.have.property(\"url\");\r

      \        pm.expect(materi).to.have.property(\"dibuat_oleh\");\r

      \        pm.expect(materi).to.have.property(\"status\");\r

      \        pm.expect(materi).to.have.property(\"dibuat_pada\");\r

      \        pm.expect(materi).to.have.property(\"diubah_pada\");\r

      \        pm.expect(materi).to.have.property(\"status_belajar\");\r

      \    });\r

      });\r

      \r

      pm.test(\"Mahasiswa hanya melihat materi terbit\", function () {\r

      \    response.items.forEach(function (materi) {\r

      \        pm.expect(materi.status).to.eql(\"terbit\");\r

      \    });\r

      });\r

      \r

      pm.test(\"Jenis file materi sesuai ketentuan\", function () {\r

      \    const jenisValid = [\r

      \        \"pdf\", \"ppt\", \"pptx\", \"doc\", \"docx\", \"xls\", \"xlsx\"\r

      \    ];\r

      \r

      \    response.items.forEach(function (materi) {\r

      \        pm.expect(jenisValid).to.include(materi.jenis);\r

      \    });\r

      });\r

      \r

      pm.test(\"URL materi valid\", function () {\r

      \    response.items.forEach(function (materi) {\r

      \        pm.expect(materi.url).to.match(/^https?:\\/\\//);\r

      \    });\r

      });\r

      \r

      pm.test(\"Jumlah item tidak melebihi limit\", function () {\r

      \    pm.expect(response.items.length).to.be.at.most(response.limit);\r

      });"
    language: text/javascript
examples: .resources/MTR-MHS-01-Melihat Daftar Materi.resources/examples
order: 1000
