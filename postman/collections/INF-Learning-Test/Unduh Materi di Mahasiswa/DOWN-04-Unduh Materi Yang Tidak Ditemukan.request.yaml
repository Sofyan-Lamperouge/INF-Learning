$kind: http-request
url: "{{base_url}}/materi/999999/unduh"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code harus 404 Not Found\", function () {\r

      \    pm.response.to.have.status(404);\r

      });\r

      \r

      pm.test(\"Response berupa JSON\", function () {\r

      \    pm.response.to.be.json;\r

      });\r

      \r

      pm.test(\"Backend mengembalikan pesan materi tidak ditemukan\", function () {\r

      \    const response = pm.response.json();\r

      \r

      \    pm.expect(response).to.have.property(\"detail\");\r

      \    pm.expect(response.detail).to.be.a(\"string\");\r

      \r

      \    pm.expect(response.detail.toLowerCase()).to.include(\"materi\");\r

      \    pm.expect(response.detail.toLowerCase()).to.include(\"tidak ditemukan\");\r

      });\r

      \r

      pm.test(\"File tidak dikirim oleh backend\", function () {\r

      \    pm.expect(pm.response.headers.get(\"Content-Disposition\")).to.be.oneOf([\r

      \        null,\r

      \        undefined\r

      \    ]);\r

      });"
    language: text/javascript
examples: .resources/DOWN-04-Unduh Materi Yang Tidak Ditemukan.resources/examples
order: 4000
