$kind: http-request
name: "Request 3.2: NIM tidak terdaftar"
url: "{{base_url}}/auth/registrasi"
method: POST
body:
  type: json
  content: "{\r

    \  \"nomor_induk\": \"2488019999\",\r

    \  \"kata_sandi\": \"{{password_test}}\",\r

    \  \"konfirmasi_kata_sandi\": \"{{password_test}}\"\r

    }"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status 200\", () => pm.response.to.have.status(200));\r

      const j = pm.response.json();\r

      pm.test(\"status aktif & peran mahasiswa\", () => {\r

      \  pm.expect(j.status).to.eql(\"aktif\");\r

      \  pm.expect(j.peran).to.eql(\"mahasiswa\");\r

      });\r

      pm.test(\"password tidak bocor\", () =>
      pm.expect(j).to.not.have.property(\"kata_sandi\"));"
    language: text/javascript
order: 6000
